# CI: clean-machine verification of every push/PR. (Mechanism overview,
# what deliberately stays local, and the cost guards: docs/ci.md.) This is the repo's proof that
# the codebase is self-contained — no dependence on an already-provisioned dev
# machine (installed Hermes, PSModulePath, encodings, uncommitted files).
#
# Deliberately NOT here: the release pipeline (package:win:*). Its exact-artifact
# stage runs the packaged app against a real installed Hermes engine and mints
# machine-captured evidence — that contract is machine-bound by design and runs
# locally per docs/RELEASING.md. CI verifies; it never releases.
name: CI

on:
  push:
    branches: [master]
    paths-ignore:
      - "docs/**"
      - "site/**"
      - "promo-video/**"
      - "**.md"
  pull_request:
    branches: [master]
    paths-ignore:
      - "docs/**"
      - "site/**"
      - "promo-video/**"
      - "**.md"
  workflow_dispatch:

permissions:
  contents: read

# Superseded runs are wasted Windows minutes (2x billing multiplier) — cancel them.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Vitest unit suite (the same `npm run test:unit` the release checklist relies
  # on), TypeScript build check, and the plugin SDK contract check (which uses
  # the committed hermes-desktop-contract.json snapshot on a machine with no
  # installed Hermes — that clean-machine path is exactly what this job proves).
  unit:
    name: Unit + contract (Windows)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npx tsc -b
      # TEMP DIAGNOSTIC (2026-08-18): packaging-config.test.ts fails suite
      # collection HERE with a stackless "SyntaxError: Invalid or unexpected
      # token" that does not reproduce locally under the same commit, an LF
      # checkout, and the runner's exact node version (22.23.2). Run 2 proved it
      # fails solo too. These probes execute the import chain OUTSIDE vitest —
      # plain node prints the offending file+line for a module compile error,
      # which vitest swallows. Remove once solved.
      - name: Diagnose packaging-config collection (temporary)
        run: |
          node -v
          node -p "require.resolve('ajv')"
          node -e "try { const A = require('ajv'); console.log('ajv cjs ok:', typeof A) } catch (e) { console.error('ajv cjs FAIL'); console.error(e.stack || e); exit(1) }"
          node -e "import('./scripts/package-win.mjs').then(m => console.log('package-win ok:', typeof m.packagingStages), e => { console.error('package-win FAIL'); console.error(e.stack || e); process.exit(1) })"
          node -e "import('./scripts/verify-no-update-metadata.mjs').then(m => console.log('verify-no-update ok'), e => { console.error(e.stack || e); process.exit(1) })"
          npx vite-node scripts/packaging-config.test.ts
          npx vitest run --reporter=verbose scripts/packaging-config.test.ts
      - name: Unit suite
        run: npm run test:unit
      - name: Plugin SDK contract (committed snapshot)
        run: npm run verify:plugin

  # The installer library suite under REAL Windows PowerShell 5.1 — the engine
  # both install doors (NSIS + Electron) actually invoke. This is where the
  # UTF-8/mojibake canary and the payload/transaction/hashing gates live.
  # verify-bootstrap.ps1 wraps the suite plus the offline isolation gate; its
  # live-GitHub release probe reports as an EXTERNAL gate (exit 0) on network
  # trouble, so this job only fails on our own bugs.
  installer:
    name: Installer lib (PowerShell 5.1)
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      # enable_plugin.py runs under "Hermes' own PyYAML" in production (the
      # resolver prefers the installed engine's venv python, which ships yaml).
      # A clean runner has no engine, so the fallback system python must carry
      # the same guarantee for the suite's backend-enable cases.
      - name: Provide PyYAML (production parity with the Hermes venv)
        run: pip install pyyaml
      # The business-install cases stage the community payload, which ships
      # js-yaml/argparse from the repo's node_modules — a real dev-machine
      # prerequisite, so the suite needs the packages installed. --ignore-scripts
      # skips the heavy electron binary postinstall this job never uses.
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Install node deps (payload staging inputs)
        run: npm ci --ignore-scripts
      - name: verify-bootstrap (lib suite + isolation, PS 5.1 inside)
        shell: powershell
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File scripts/verify-bootstrap.ps1

  # The Hermes-plugin Python suites (WhatsApp policy guard, companion dashboard
  # backend, community archive). Stdlib-only; the live installed-Hermes probes
  # self-skip when no engine is present (unittest.skipIf), so a clean runner
  # exercises every deterministic gate. Windows runner on purpose: the plugin
  # ships to Windows Hermes installs.
  plugins:
    name: Plugin suites (Python)
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: WhatsApp policy suite
        run: python -m unittest discover -s hermes-plugin/business-whatsapp-policy/tests -p "test_*.py" -v
      - name: Companion dashboard backend suite
        run: python -m unittest discover -s hermes-plugin/business-shell/dashboard -p "test_*.py" -v
      - name: Community archive suite
        run: python -B -m unittest discover -s hermes-plugin/community-archive/tests -p "test_*.py" -v
